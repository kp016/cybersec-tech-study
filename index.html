<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COIT11241 · Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3f6ee;        /* page background (off-white, warm) */
  --cream2:#eaf0e2;
  --paper:#ffffff;        /* cards */
  --ink:#1b2a20;          /* main text */
  --ink-soft:#5f7166;     /* muted */
  --green:#2f9e6b;        /* primary */
  --green-bright:#3bb47c;
  --green-deep:#1f7a52;   /* headings */
  --green-dark:#12402d;   /* sidebar base */
  --green-dark2:#0d3122;
  --green-soft:#e7f4ec;   /* soft fill */
  --green-soft2:#d8ecdf;
  --gold:#c58a2e;         /* warm accent for "due" */
  --gold-soft:#f7edda;
  --rose:#d0645c;         /* incorrect */
  --rose-soft:#f8e6e4;
  --line:#e0e8db;
  --shadow:0 1px 2px rgba(20,60,40,.04), 0 8px 24px rgba(20,60,40,.06);
  --shadow-sm:0 1px 3px rgba(20,60,40,.07);
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--green-soft2);}
#layout{display:flex; min-height:100vh;}

/* ===================== SIDEBAR ===================== */
#sidebar{
  width:280px; flex-shrink:0; color:#dcefe1;
  background:linear-gradient(165deg,var(--green-dark) 0%, var(--green-dark2) 100%);
  padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar::-webkit-scrollbar{width:8px;}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-radius:8px;}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 2px;}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(145deg,var(--green-bright),var(--green-deep));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.brand h1{font-family:'Fraunces',serif; font-size:19px; margin:0; color:#fff; font-weight:600; letter-spacing:.2px;}
.brand .tag{font-size:11px; color:#8fc3a4; margin-top:1px;}
.side-meta{font-size:11px;color:#7fb598;padding:6px 10px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;}

.nav-label{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#6ea888; margin:16px 10px 7px; font-weight:600;}
.nav-btn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:transparent; border:none; color:#cfe7d7; padding:9px 11px;
  border-radius:11px; cursor:pointer; font-size:13.5px; font-family:inherit;
  margin-bottom:3px; transition:background .15s, color .15s; position:relative;
}
.nav-btn .ic{width:20px;text-align:center;font-size:14px;opacity:.9;}
.nav-btn .lbl{flex:1; line-height:1.3;}
.nav-btn:hover{background:rgba(255,255,255,.07); color:#fff;}
.nav-btn.active{background:rgba(255,255,255,.14); color:#fff; font-weight:600;}
.nav-btn.active::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--green-bright);}
.nav-btn.sub{padding-left:14px; font-size:12.5px;}
.pill{font-size:10px; padding:2px 8px; border-radius:20px; background:rgba(255,255,255,.13); color:#bfe0cc; font-weight:600; white-space:nowrap;}
.pill.done{background:var(--green-bright); color:#0c3323;}

/* ===================== MAIN ===================== */
#main{flex:1; min-width:0;}
#topbar{
  position:sticky; top:0; z-index:20; background:rgba(243,246,238,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:15px 34px; display:flex; align-items:center; justify-content:space-between;
}
#topbar .crumb{font-size:13px; color:var(--ink-soft);}
#topbar .crumb b{color:var(--green-deep);}
#topbar .term-badge{font-size:11.5px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); padding:5px 12px; border-radius:20px;}
#content{padding:0 34px 90px; max-width:940px; margin:0 auto;}

/* Hero */
.hero{
  margin:26px 0 22px; padding:30px 32px; border-radius:20px; position:relative; overflow:hidden;
  background:linear-gradient(130deg,var(--green-deep),var(--green) 65%, var(--green-bright));
  color:#fff; box-shadow:0 10px 30px rgba(31,122,82,.22);
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);}
.hero::before{content:"";position:absolute;right:70px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06);}
.hero .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.14em; color:#c7ead4; font-weight:600; margin-bottom:8px;}
.hero h2{font-family:'Fraunces',serif; font-size:29px; margin:0 0 8px; font-weight:600; line-height:1.15;}
.hero p{margin:0; font-size:14.5px; color:#e4f4ea; max-width:640px; position:relative; z-index:1;}

/* Cards */
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow-sm);
}
.card.section{padding-left:24px; border-left:4px solid var(--green);}
.card h3{
  font-family:'Fraunces',serif; margin:0 0 4px; font-size:18px; color:var(--green-deep); font-weight:600;
  display:flex; align-items:center; gap:9px;
}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--green-bright);}
.card h4{font-size:14px; color:var(--green-deep); margin:18px 0 7px; font-weight:600;}
.card > h4:first-child{margin-top:2px;}
.card p{margin:8px 0;}
.card ul, .card ol{margin:8px 0 8px 4px; padding-left:20px;}
.card li{margin-bottom:6px;}
.muted{color:var(--ink-soft);}
.lead{color:var(--ink-soft); font-size:13.5px; margin:-2px 0 16px;}

code, .code-inline{
  background:var(--green-soft); color:var(--green-deep); padding:1.5px 6px; border-radius:6px;
  font-family:"SF Mono", Consolas, "Cascadia Code", monospace; font-size:12.6px; font-weight:500;
}
pre{
  background:#0f2e21; border-radius:12px; padding:14px 16px; overflow-x:auto;
  font-size:12.6px; color:#c6ead3; font-family:"SF Mono", Consolas, monospace; line-height:1.6;
  margin:12px 0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
pre code{background:none; padding:0; color:inherit; font-weight:400;}
pre .cmt{color:#6fae8b;}

table.ref{width:100%; border-collapse:collapse; font-size:13px; margin:12px 0; overflow:hidden; border-radius:10px; box-shadow:0 0 0 1px var(--line);}
table.ref th, table.ref td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line);}
table.ref th{background:var(--green-soft); color:var(--green-deep); font-weight:600; font-size:12.5px;}
table.ref tr:last-child td{border-bottom:none;}
table.ref tr:nth-child(even) td{background:#fafcf8;}

.terms-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.term{background:var(--green-soft); border-radius:12px; padding:13px 15px;}
.term b{color:var(--green-deep); display:block; font-size:13px; margin-bottom:4px; font-weight:600;}
.term span{font-size:12.6px; color:#4b5f52;}
@media(max-width:640px){.terms-grid{grid-template-columns:1fr;}}

/* Section header row with icon chip */
.sec-head{display:flex; align-items:center; gap:12px; margin:32px 2px 12px;}
.sec-head .chip{
  width:40px;height:40px;border-radius:12px;flex-shrink:0; display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--green-soft); color:var(--green-deep); box-shadow:inset 0 0 0 1px var(--green-soft2);
}
.sec-head h3{font-family:'Fraunces',serif; margin:0; font-size:19px; color:var(--ink); font-weight:600;}
.sec-head p{margin:1px 0 0; font-size:12.5px; color:var(--ink-soft);}

/* Lab checklist */
.lab-group{margin-bottom:16px;}
.lab-group .g-title{font-size:13.5px; font-weight:600; color:var(--green-deep); margin:14px 0 6px; display:flex; align-items:center; gap:8px;}
.lab-group .g-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);}
.lab-step{display:flex; gap:11px; align-items:flex-start; padding:9px 12px; border-radius:10px; transition:background .12s;}
.lab-step:hover{background:var(--cream);}
.lab-step input[type=checkbox]{
  appearance:none;-webkit-appearance:none;margin-top:2px;width:18px;height:18px;flex-shrink:0;
  border:2px solid var(--green); border-radius:6px; cursor:pointer; position:relative; transition:.12s;
}
.lab-step input[type=checkbox]:checked{background:var(--green); border-color:var(--green);}
.lab-step input[type=checkbox]:checked::after{content:"✓";position:absolute;color:#fff;font-size:12px;top:-1px;left:2.5px;font-weight:700;}
.lab-step label{font-size:13.3px; cursor:pointer;}
.lab-step.done label{color:var(--ink-soft); text-decoration:line-through;}

/* Tags */
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:4px 11px; border-radius:20px; font-weight:600; letter-spacing:.02em;}
.tag.theory{background:var(--green-soft); color:var(--green-deep);}
.tag.lab{background:#e5f0f6; color:#2f6d94;}
.tag.slide{background:var(--gold-soft); color:var(--gold);}
.tag.due{background:var(--gold-soft); color:var(--gold);}

/* Progress */
.progress-bar{height:9px; background:var(--cream2); border-radius:8px; overflow:hidden; margin:10px 0 4px;}
.progress-bar > div{height:100%; background:linear-gradient(90deg,var(--green),var(--green-bright)); border-radius:8px; transition:width .4s ease;}
.ring-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.ring{position:relative; width:120px; height:120px;}
.ring svg{transform:rotate(-90deg);}
.ring .val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring .val b{font-family:'Fraunces',serif; font-size:26px; color:var(--green-deep); line-height:1;}
.ring .val span{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}

/* Quiz */
.quiz{margin-top:4px;}
.quiz-q{margin-bottom:16px; padding:16px 18px; border:1px solid var(--line); border-radius:14px; background:#fbfdfa;}
.quiz-q .qtext{font-weight:600; margin:0 0 12px; font-size:14px; display:flex; gap:9px;}
.quiz-q .qnum{color:#fff; background:var(--green); min-width:22px; height:22px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; flex-shrink:0; margin-top:1px;}
.qopt{display:flex; align-items:flex-start; gap:10px; padding:9px 13px; border-radius:10px; margin-bottom:7px; cursor:pointer; background:var(--paper); border:1.5px solid var(--line); transition:.12s; font-size:13.3px;}
.qopt:hover{border-color:var(--green-soft2); background:var(--green-soft);}
.qopt input{margin-top:3px; accent-color:var(--green);}
.qopt.correct{background:var(--green-soft); border-color:var(--green);}
.qopt.correct::after{content:"✓ correct"; margin-left:auto; font-size:11px; color:var(--green-deep); font-weight:600; white-space:nowrap;}
.qopt.incorrect{background:var(--rose-soft); border-color:var(--rose);}
.qopt.incorrect::after{content:"your answer"; margin-left:auto; font-size:11px; color:var(--rose); font-weight:600; white-space:nowrap;}
.explain{margin-top:10px; font-size:12.6px; color:#4b5f52; background:var(--green-soft); border-radius:9px; padding:10px 13px; display:none;}
.explain.show{display:block;}
.explain b{color:var(--green-deep);}

.btn{
  background:var(--green); color:#fff; border:none; padding:11px 22px; border-radius:11px;
  font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:.15s; box-shadow:0 4px 12px rgba(47,158,107,.24);
}
.btn:hover{background:var(--green-deep); transform:translateY(-1px);}
.btn.secondary{background:var(--paper); color:var(--green-deep); border:1.5px solid var(--line); box-shadow:none;}
.btn.secondary:hover{background:var(--cream); border-color:var(--green-soft2);}
.btn-row{display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap;}
.score-badge{font-size:14px; font-weight:700; color:var(--green-deep); background:var(--green-soft); padding:8px 16px; border-radius:11px; display:none;}
.score-badge.show{display:inline-block;}

.vm-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:13px; margin:14px 0;}
.vm-box{background:var(--green-soft); border-radius:13px; padding:14px 16px; font-size:12.5px; border:1px solid var(--green-soft2);}
.vm-box .name{font-family:'Fraunces',serif; color:var(--green-deep); font-size:15px; font-weight:600; margin-bottom:2px;}
.vm-box .role{color:var(--ink-soft); font-size:11.5px; margin-bottom:8px;}
.vm-box .kv{font-size:12px; margin:2px 0;}

hr.sep{border:none; border-top:1px solid var(--line); margin:20px 0;}
a{color:var(--green-deep); text-decoration:none; border-bottom:1px solid var(--green-soft2);}
a:hover{border-color:var(--green);}
footer.note{margin-top:36px; font-size:11.5px; color:var(--ink-soft); text-align:center; padding-top:20px; border-top:1px solid var(--line);}

.week-chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.wchip{background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:11px 14px; font-size:12.5px; flex:1; min-width:150px; box-shadow:var(--shadow-sm);}
.wchip b{color:var(--green-deep); display:block; font-size:12.5px;}
.wchip span{color:var(--ink-soft); font-size:11.5px;}
</style>
</head>
<body>
<div id="layout">
  <nav id="sidebar"></nav>
  <div id="main">
    <div id="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="term-badge">COIT11241 · HT2 2026</div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
/* =========================================================
   COIT11241 Cybersecurity Technologies — Study Hub
   Content is data-driven. To add Week 7+:
     - add an object to WEEKS (copy an existing one)
     - add a TESTS entry after every 2nd week
   Each week can carry: readings, theory[], keyTerms[], labs[],
   slideQuiz[] (questions taken straight from that week's slides).
   Progress + quiz bests persist via localStorage.
   ========================================================= */

const VM_TABLE = [
  {name:"Greenbone", role:"Vulnerability scanner", ip:"192.168.56.2", fwd:"host 2443 → 443", cred:"admin / admin"},
  {name:"Kali", role:"Attacker box", ip:"192.168.56.34", fwd:"—", cred:"kali / kali"},
  {name:"Metasploitable2", role:"Victim (deliberately vulnerable)", ip:"192.168.56.35", fwd:"host 35080 → 80", cred:"msfadmin / msfadmin"},
  {name:"Win8 / DC", role:"PowerShell / domain controller", ip:"192.168.56.50", fwd:"—", cred:"vagrant / vagrant"},
];
function vmGridHtml(){
  return `<div class="vm-grid">${VM_TABLE.map(v=>`
    <div class="vm-box"><div class="name">${v.name}</div><div class="role">${v.role}</div>
      <div class="kv">IP&nbsp; <code>${v.ip}</code></div>
      <div class="kv">Fwd&nbsp; ${v.fwd}</div>
      <div class="kv">Login&nbsp; <code>${v.cred}</code></div>
    </div>`).join("")}</div>`;
}

const WEEKS = [
// ============================================ WEEK 1
{
  id:1, title:"Systems Approach to Cybersecurity",
  blurb:"Foundations — what cybersecurity covers, the CIA(AAAN) goals, McCumber's Cube, STRIDE-LM, and getting VirtualBox running.",
  readings:["Lecture slides: Wk1 Cyber Security Technologies", "Foundational / lecture-driven week (no set textbook chapter)"],
  theory:[
    {h:"What is Cybersecurity?", html:`
      <p>Cybersecurity ≈ reducing information security incidents and their impact. Threats come from several directions:</p>
      <ul>
        <li><b>Trespass</b> — physical & network intrusion (e.g. a "cleaner" with unauthorised server access)</li>
        <li><b>People</b> — naive users with weak passwords, or who open malicious emails</li>
        <li><b>DevOps</b> — buggy code & misconfigured servers create weaknesses attackers exploit</li>
        <li><b>Hardware failure</b> — a failing hard drive, or unreadable legacy media</li>
      </ul>
      <p>Scope covers every <b>system component</b>: network, hardware, software, people, processes and information.</p>
      <h4>Simplified attack lifecycle</h4>
      <table class="ref"><tr><th>Stage</th><th>Example</th></tr>
      <tr><td>Threat</td><td>Evil Eve (the threat actor)</td></tr>
      <tr><td>Vulnerability</td><td>Alice's misplaced trust</td></tr>
      <tr><td>Incident</td><td>Alice opens a phishing email</td></tr>
      <tr><td>Impact</td><td>Alice's files are encrypted</td></tr></table>`},
    {h:"CIA → CIAAAN", html:`
      <p>The classic <b>CIA triad</b> is expanded in this unit to <b>CIAAAN</b>:</p>
      <table class="ref"><tr><th>Goal</th><th>Meaning</th><th>Example breach</th></tr>
      <tr><td>Confidentiality</td><td>Only authorised parties can read data</td><td>Packet-sniff a password during a browser sync</td></tr>
      <tr><td>Integrity</td><td>Data isn't improperly modified</td><td>Disk corruption alters a bank balance</td></tr>
      <tr><td>Availability</td><td>Service accessible when needed</td><td>DDoS / power loss stops a server</td></tr>
      <tr><td>Authenticity</td><td>A party/data is who/what it claims</td><td>Phishing email impersonating a bank</td></tr>
      <tr><td>Authorisation</td><td>A party only does what it's permitted</td><td>SQL injection lets a TA 'become' you</td></tr>
      <tr><td>Non-repudiation</td><td>A party can't deny an action</td><td>TA denies opening a card in your name</td></tr></table>`},
    {h:"Data States", html:`
      <p>Find the riskiest data by its <b>state</b> — described by three features:</p>
      <ul>
        <li><b>Location</b> — more environments (cloud) = bigger attack surface; endpoints (PCs, mobiles) are least protected yet hold valuable data</li>
        <li><b>Type</b> — Storage &lt; Processing &lt; <b>Transit (most vulnerable)</b></li>
        <li><b>Classification</b> — public, proprietary, confidential — classify everything</li>
      </ul>`},
    {h:"McCumber's Cube", html:`
      <p>McCumber's Cube ≈ <b>Goals × Information States × Security Measures</b>. A checklist: for each goal, consider info in <i>storage / transit / processing</i>, addressed through <i>technology / people / process</i> (Tech = HW + SW + NW).</p>
      <p><b>Example</b> — confidentiality of a stored patient database: <i>Technology</i> = choose best encryption; <i>People</i> = train staff to use it; <i>Process</i> = policy for handling unencrypted data.</p>`},
    {h:"STRIDE-LM", html:`
      <p>STRIDE-LM lists breaches from the <b>attacker's</b> side — the mirror of CIAAAN:</p>
      <table class="ref"><tr><th>Letter</th><th>Breach</th><th>Mirrors</th></tr>
      <tr><td>S</td><td>Spoofing</td><td>Authenticity</td></tr>
      <tr><td>T</td><td>Tampering</td><td>Integrity</td></tr>
      <tr><td>R</td><td>Repudiation</td><td>Non-repudiation</td></tr>
      <tr><td>I</td><td>Information disclosure</td><td>Confidentiality</td></tr>
      <tr><td>D</td><td>Denial of Service</td><td>Availability</td></tr>
      <tr><td>E</td><td>Elevation of privilege</td><td>Authorisation</td></tr>
      <tr><td>LM</td><td>Lateral Movement</td><td>(spreading through an environment)</td></tr></table>`},
    {h:"VirtualBox: Host, Guest & Networking", html:`
      <p><b>Host</b> = your physical PC. <b>Guest</b> = the VM's OS.</p>
      <ul>
        <li><b>NAT (Adapter 1)</b> — guest reaches the internet, sharing the host IP (guest gets e.g. <code>10.0.2.15/24</code>)</li>
        <li><b>Internal Network (Adapter 2)</b> — guest-to-guest only; all unit VMs use name <code>192.168.56.0/24</code> ("the name isn't magic")</li>
        <li><b>Port forwarding</b> — mail-redirect for TCP/UDP: host port → guest port, so host browser can reach guest services</li>
        <li><b>Shared folders</b> — move files host↔guest without storing them in the guest; use Auto-mount</li>
      </ul>
      <p class="muted">Treat VMs as "cattle, not pets": snapshot before risky changes; if a guest is unresponsive use Power Off, and re-import if badly broken. Release a captured mouse with the <b>Right Ctrl</b> host key.</p>
      <h4>Prerequisites</h4>
      <ul><li>≥12GB RAM, ≥128GB free disk (or USB3.0)</li><li>Enable Virtualisation (VT-x) in BIOS — check Task Manager → Performance → CPU</li><li>Consider disabling Hyper-V (conflicts with VirtualBox)</li></ul>`},
  ],
  keyTerms:[
    {t:"CIAAAN", d:"Confidentiality, Integrity, Availability, Authenticity, Authorisation, Non-repudiation."},
    {t:"McCumber's Cube", d:"Goals × Information States × Measures — a checklist for eliciting risks & controls."},
    {t:"STRIDE-LM", d:"Spoofing, Tampering, Repudiation, Info disclosure, DoS, Elevation of privilege, Lateral Movement."},
    {t:"Threat Actor (TA)", d:"The party carrying out an attack."},
    {t:"Host / Guest", d:"Host = physical machine; Guest = OS inside a VM."},
    {t:"NAT vs Internal Network", d:"NAT = guest→internet. Internal = guest↔guest only, isolated from host & internet."},
  ],

{
  id:2, title:"PowerShell Fundamentals",
  blurb:"Variables, arrays, conditionals, loops, the object pipeline, and PowerShell networking & event cmdlets.",
  readings:["Hassell (2017) Ch.6 — Filtering & Limiting (Where-Object)","Sukhija (2021) Ch.1 — PowerShell Basics (optional)"],
  theory:[
    {h:"Variables, Arrays & Types", html:`
      <pre>$a = "1"
$b = "Vikas"
Write-host $b -ForegroundColor Green
$b = "A","B","C"        <span class="cmt"># implicit array</span>
$c = @("s1","s2")       <span class="cmt"># explicit array</span>
$d = @()                <span class="cmt"># empty/dynamic array</span>
[int]$a = "10"          <span class="cmt"># explicit type</span></pre>
      <p>Types: <code>[string]</code>, <code>[char]</code>, <code>[int]</code>, <code>[array]</code>.</p>`},
    {h:"Conditionals & Operators", html:`
      <pre>if ($a -gt 9) { "big" } else { "small" }</pre>
      <table class="ref"><tr><th>Op</th><th>Meaning</th></tr>
      <tr><td><code>-eq</code> / <code>-ne</code></td><td>equal / not equal</td></tr>
      <tr><td><code>-gt</code> / <code>-ge</code></td><td>greater / or equal</td></tr>
      <tr><td><code>-lt</code> / <code>-le</code></td><td>less / or equal</td></tr>
      <tr><td><code>-like</code></td><td>wildcard match</td></tr>
      <tr><td><code>-match</code></td><td>regex match</td></tr></table>
      <p>Logical: <code>-and</code>, <code>-or</code>, <code>-not</code> / <code>!</code></p>`},
    {h:"Loops & Functions", html:`
      <pre>foreach ($i in $x) { ... }         <span class="cmt"># classic</span>
$x | foreach-object { $_ }          <span class="cmt"># pipe form, uses $_</span>
for ($i=1; $i -le 5; $i++) { ... }
Function Add ($a,$b) { $a + $b }
Add 5 6</pre>`},
    {h:"The Object Pipeline", html:`
      <p>PowerShell pipes <b>objects</b>, not text. <code>ls</code> emits a FileInfo/DirectoryInfo object per entry, each with properties (Name, Length, LastWriteTime) and methods (e.g. <code>MoveTo</code>).</p>
      <pre>ls | Get-Member                 <span class="cmt"># properties & methods</span>
(ls).Name                        <span class="cmt"># dot operator, per object</span>
ls | Where Name -like "hello.*"
ls | Where Length -ge 5
ls | Select -first 1
ls | Select Mode, Name -first 1  <span class="cmt"># pick/reorder columns</span>
$ext = ls hello.*; $ext.Extension</pre>
      <p class="muted"><code>$_</code> = "the current object" inside Where-Object / ForEach-Object.</p>`},
    {h:"Common Shell Commands", html:`
      <table class="ref"><tr><th>Command</th><th>Real cmdlet</th><th>Purpose</th></tr>
      <tr><td><code>echo "x" &gt; f</code></td><td>Write-Output + &gt;</td><td>write to file</td></tr>
      <tr><td><code>cat</code></td><td>Get-Content</td><td>show file</td></tr>
      <tr><td><code>pwd</code></td><td>Get-Location</td><td>working dir</td></tr>
      <tr><td><code>ls</code></td><td>Get-ChildItem</td><td>list entries</td></tr>
      <tr><td><code>cp</code>/<code>mv</code></td><td>Copy-Item/Move-Item</td><td>copy/move</td></tr>
      <tr><td><code>ps</code></td><td>Get-Process</td><td>list processes</td></tr></table>`},
    {h:"Networking Cmdlets", html:`
      <table class="ref"><tr><th>Task</th><th>Cmdlet</th><th>Deprecated</th></tr>
      <tr><td>MAC & link status</td><td><code>Get-NetAdapter</code></td><td>ip link</td></tr>
      <tr><td>IP address</td><td><code>Get-NetIPAddress</code></td><td>ipconfig</td></tr>
      <tr><td>ARP cache / neighbours</td><td><code>Get-NetNeighbor</code></td><td>arp</td></tr>
      <tr><td>Gateway & DNS server</td><td><code>Get-NetIPConfiguration</code></td><td>—</td></tr>
      <tr><td>Test connection</td><td><code>Test-NetConnection</code> (tnc)</td><td>ping</td></tr>
      <tr><td>Resolve DNS → IP</td><td><code>Resolve-DnsName</code></td><td>nslookup</td></tr>
      <tr><td>TCP connections</td><td><code>Get-NetTCPConnection</code></td><td>netstat</td></tr></table>
      <pre>Get-NetTCPConnection | where RemotePort -eq 443   <span class="cmt"># 443 = HTTPS</span></pre>`},
    {h:"Events, Sysmon & Processes", html:`
      <pre>Get-WinEvent system | Out-GridView
(get-winevent *sysmon* | where id -eq 22 | select -first 1).message  <span class="cmt"># DNS query</span>
ps "*calc*" | Stop-Process</pre>
      <table class="ref"><tr><th>Log</th><th>Id</th><th>Meaning</th></tr>
      <tr><td>Security</td><td>4624 / 4625</td><td>Logon / Failed logon</td></tr>
      <tr><td>Sysmon</td><td>1 / 3 / 11</td><td>Process created / Network conn / File create</td></tr>
      <tr><td>Sysmon</td><td>22</td><td>DNS query</td></tr></table>`},
  ],

// ============================================ WEEK 3
{
  id:3, title:"Prioritising Controls (Frameworks)",
  blurb:"Controls vs frameworks, Essential 8, CIS Controls v8, NIST CSF, plus Windows Firewall, registry & CIM exploration.",
  readings:["CIS Controls v8 — read at least pages 8–19 (Controls 1–4)"],
  theory:[
    {h:"Controls vs Frameworks", html:`
      <p><b>Controls</b> = cybersecurity requirements ("automate backups", "use a DNS filter"). Prioritising them alone is hard (Sony once shipped rootkit CDs, prioritising DRM over customers' data integrity). <b>Frameworks</b> curate & prioritise controls.</p>
      <ul><li><b>Comprehensive</b> (can overwhelm): NIST CSF, NIST SP 800</li><li><b>Prioritised</b> (best reward for least effort): Essential 8, CIS Controls</li></ul>`},
    {h:"ACSC Essential Eight", html:`
      <ol><li>Application control</li><li>Patch applications</li><li>Restrict MS Office macros</li><li>User application hardening</li><li>Restrict admin privileges</li><li>Patch operating systems</li><li>Multi-factor authentication (MFA)</li><li>Regular backups</li></ol>`},
    {h:"CIS Controls v8 (18 controls)", html:`
      <p>CIS ≈ Essential 8 + more; the first 7 map well to E8 (E8.1 App control ↔ CIS 2).</p>
      <table class="ref"><tr><th>#</th><th>Control</th><th>#</th><th>Control</th></tr>
      <tr><td>1</td><td>Inventory of Enterprise Assets</td><td>10</td><td>Malware Defenses</td></tr>
      <tr><td>2</td><td>Inventory of Software Assets</td><td>11</td><td>Data Recovery</td></tr>
      <tr><td>3</td><td>Data Protection</td><td>12</td><td>Network Infrastructure Mgmt</td></tr>
      <tr><td>4</td><td>Secure Configuration</td><td>13</td><td>Network Monitoring & Defense</td></tr>
      <tr><td>5</td><td>Account Management</td><td>14</td><td>Security Awareness Training</td></tr>
      <tr><td>6</td><td>Access Control Mgmt</td><td>15</td><td>Service Provider Mgmt</td></tr>
      <tr><td>7</td><td>Continuous Vuln Mgmt</td><td>16</td><td>Application Software Security</td></tr>
      <tr><td>8</td><td>Audit Log Management</td><td>17</td><td>Incident Response Mgmt</td></tr>
      <tr><td>9</td><td>Email & Browser Protections</td><td>18</td><td>Penetration Testing</td></tr></table>
      <p><b>CIM</b> (Common Information Model) is the industry standard for device info: <code>Get-CimInstance CIM_ComputerSystem</code> (avoid deprecated WMI). Safeguard 9.2 = DNS filtering.</p>`},
    {h:"NIST Cybersecurity Framework", html:`
      <p>Technology-agnostic, organised around defender processes:</p>
      <table class="ref"><tr><th>Function</th><th>Example</th></tr>
      <tr><td>Identify</td><td>Understand risk to assets</td></tr>
      <tr><td>Protect</td><td>Install a firewall</td></tr>
      <tr><td>Detect</td><td>IDS</td></tr>
      <tr><td>Respond</td><td>Turn off router, inform staff</td></tr>
      <tr><td>Recover</td><td>Restore from backup</td></tr></table>`},
    {h:"Backups — the 3-2-1 rule", html:`<p>3 copies, 2 different media, 1 offsite. Always <b>test restores</b> — "no-one cares if you can back up, only if you can restore." Protect backups with encryption, air gaps, immutability.</p>`},
    {h:"Registry, Services & File Hashes", html:`
      <pre>Get-ItemProperty "...\\FirewallPolicy\\PublicProfile"  <span class="cmt"># EnableFirewall 0=off 1=on</span>
(Get-Service | Where DisplayName -like "*Firewall*").Status
Get-FileHash &lt;path&gt;   <span class="cmt"># SHA256, detect tampering</span>
Get-CimInstance Win32_GroupUser | where GroupComponent -like "*Admin*"</pre>`},
  ],
  keyTerms:[
    {t:"Control", d:"A specific cybersecurity requirement (e.g. 'automate backups')."},
    {t:"Framework", d:"A curated set of controls (Essential 8, CIS Controls, NIST CSF)."},
    {t:"CIM", d:"Common Information Model — standard for device/software info via Get-CimInstance."},
    {t:"Allowlist vs Blocklist", d:"Allowlist = deny by default (more secure); blocklist = allow by default."},
    {t:"3-2-1 backup", d:"3 copies, 2 media, 1 offsite — and test your restores."},

// ============================================ WEEK 4
{
  id:4, title:"Cyber Threat Intelligence & MITRE ATT&CK",
  blurb:"Attacker behaviour: ATT&CK, CAPEC, CWE, IOCs, the Pyramid of Pain, and the Emotet case study. (A1 Recon due.)",
  readings:["Thompson (2020) Ch.3 — Threat Intelligence (ATT&CK lifecycle, STIX, Pyramid of Pain, evaluating CTI)"],
  theory:[
    {h:"Why CTI?", html:`<p>Cyber Threat Intelligence helps you understand a Threat Actor's motivations, tools & tactics, and predict/prevent attacks. Detecting a <i>technique</i> (phishing) hurts an attacker far more than blocking one file hash — the idea behind the Pyramid of Pain.</p>`},
    {h:"ATT&CK vs CAPEC vs CWE", html:`
      <table class="ref"><tr><th>Framework</th><th>Answers</th><th>Example</th></tr>
      <tr><td><b>ATT&CK</b></td><td>Who does what (real TA behaviour)</td><td>Emotet gains access via phishing</td></tr>
      <tr><td><b>CAPEC</b></td><td>How weaknesses are exploited (patterns)</td><td>CAPEC-407 Pretexting</td></tr>
      <tr><td><b>CWE</b></td><td>The weakness itself</td><td>CWE-451 UI misrepresentation</td></tr></table>
      <p class="muted">Analogy: ATT&CK techniques are object <i>instances</i>; CAPECs are the <i>class/template</i>.</p>`},
    {h:"IOCs & the Pyramid of Pain", html:`
      <p><b>IOCs</b> (Indicators of Compromise) include host artefacts (filenames, registry, service activity, named mutexes) and network artefacts (SMTP, user agents, domains/IPs, hashes). A named mutex like <code>McAfeeVscanBofUpdateMutex</code> can itself be an IOC.</p>
      <p>The <b>Pyramid of Pain</b> ranks IOCs by how costly they are for a TA to change if detected — roughly, hash values → IPs → domains → host/network artifacts → tools → <b>TTPs</b> (top = most painful). Detecting TTPs is far more disruptive than blocking a hash.</p>`},
    {h:"MITRE ATT&CK Tactics", html:`
      <table class="ref"><tr><th>Tactic</th><th>Example</th></tr>
      <tr><td>Initial Access</td><td>Phishing email</td></tr>
      <tr><td>Execution</td><td>Run a payload</td></tr>
      <tr><td>Persistence</td><td>Startup task / run key</td></tr>
      <tr><td>Privilege Escalation</td><td>Process injection</td></tr>
      <tr><td>Defense Evasion</td><td>Hidden files, encoded macros</td></tr>
      <tr><td>Credential Access</td><td>Steal passwords from memory</td></tr>
      <tr><td>Discovery</td><td>List processes, find shares</td></tr>
      <tr><td>Lateral Movement</td><td>SMB / remote services</td></tr>
      <tr><td>Collection</td><td>Steal emails</td></tr>
      <tr><td>Command & Control</td><td>Hide commands in DNS</td></tr>
      <tr><td>Exfiltration</td><td>Download data out</td></tr>
      <tr><td>Impact</td><td>Encrypt data (ransomware)</td></tr></table>`},
    {h:"Case Study: Emotet", html:`
      <ul>
        <li><b>Initial Access (T1566):</b> phishing with macro-enabled .xlsm</li>
        <li><b>Execution (T1204.002 / T1059):</b> macro runs a malicious DLL via <code>regsvr32.exe</code> or PowerShell/cmd</li>
        <li><b>Persistence (T1547 / T1053):</b> startup folder, scheduled task</li>
        <li><b>Defense Evasion (T1027):</b> encodes macros to hide URLs</li>
        <li><b>Credential Access (T1555 / T1003):</b> browser & in-memory password theft (Mimikatz)</li>
        <li><b>Lateral Movement (T1021):</b> spreads via SMB</li>
        <li><b>Collection (T1114):</b> steals emails</li>
        <li><b>C2 (T1573):</b> RSA-encrypted channel</li>
      </ul>
      <p class="muted">Emotet: banking trojan → Malware-as-a-Service; ~$5B stolen since 2014.</p>`},
    {h:"Atomic Red Team (ART)", html:`
      <p>ART maps benign test scripts to ATT&CK techniques so you can safely test your defences.</p>
      <pre>Invoke-AtomicTest T1566.001 -TestNumbers 1 -showdetails   <span class="cmt"># emulate phishing download</span>
Invoke-AtomicTest T1057 -TestNumbers 2,3                   <span class="cmt"># process discovery</span></pre>
      <p class="muted">ART isn't pre-installed on Win8 — copy commands from the ART website/GitHub.</p>`},
  ],
  keyTerms:[
    {t:"ATT&CK", d:"MITRE base of real adversary tactics & techniques — 'who does what'."},
    {t:"CAPEC", d:"Attack patterns — 'how' a weakness is exploited."},
    {t:"CWE", d:"Common Weakness Enumeration — the weakness being exploited."},
    {t:"IOC", d:"Indicator of Compromise — hash, IP, filename, mutex, event, etc."},
    {t:"Pyramid of Pain", d:"Ranks IOCs by attacker cost-to-change; TTPs hurt most."},
    {t:"MaaS", d:"Malware-as-a-Service — malware/botnets rented commercially."},
  ],

{
  id:6, title:"Monitoring & Zero Trust Architecture",
  blurb:"Sysmon detection, alert fatigue & risk, the POLICY principles, and Zero Trust vs legacy architecture. (A1 Vulns due.)",
  readings:["Garbis & Chapman (2021) Ch.3 (skim ~pp.5-16) — historical vs Zero Trust architecture; Table 3.2 PDP/PEP policy"],
  theory:[
    {h:"Sysmon-based Detection", html:`
      <pre>Get-WinEvent *Sysmon* | where message -like "*T1055*" | select -first 1 | format-list
<span class="cmt"># Id 8  CreateRemoteThread detected — technique T1055 Process Injection</span></pre>
      <p>Sysmon events map directly onto ATT&CK technique IDs, making tactic-hunting far more direct than raw Windows logs.</p>`},
    {h:"Alert Fatigue & Risk", html:`
      <ul>
        <li><b>False positive</b> — an alert that isn't a real attack; too many cause <i>alert fatigue</i></li>
        <li><b>False negative</b> — a real attack that goes undetected</li>
        <li><b>Risk = Likelihood × Impact.</b> Only alert above your org's risk threshold — which is subjective (a library vs a military org rate "run Calculator as admin" differently)</li>
      </ul>`},
    {h:"POLICY — Security Principles", html:`
      <table class="ref"><tr><th>Letter</th><th>Principle</th><th>Example</th></tr>
      <tr><td>P</td><td>Privilege (least privilege)</td><td>RBAC; devs shouldn't be admins; MFA</td></tr>
      <tr><td>O</td><td>Open design</td><td>Security not from secrecy (RSA relies on factoring, not a hidden algorithm)</td></tr>
      <tr><td>L</td><td>Layering (defense in depth)</td><td>Fence → Guards → Encryption</td></tr>
      <tr><td>I</td><td>Isolation</td><td>Micro-segmentation; split a database</td></tr>
      <tr><td>C</td><td>Complete mediation</td><td>Every access checked every time</td></tr>
      <tr><td>Y</td><td>fail safelY & securelY</td><td>Default-deny, add exceptions</td></tr>
      <tr><td>+</td><td>Continuous monitoring</td><td>Constant detection, not point-in-time</td></tr></table>`},
    {h:"Legacy vs Zero Trust", html:`
      <p><b>Legacy</b> networks grant broad implicit trust once you're "inside" (e.g. everyone can reach the file server after VPN + password). This fails today — any exploited user effectively becomes a trusted insider.</p>
      <p><b>Zero Trust</b> assumes no implicit trust: least privilege, isolation via micro-segments, complete mediation (traffic enriched with identity/context), continuous monitoring.</p>
      <p><b>PDP</b> (Policy Decision Point) holds the policies; <b>PEP</b> (Policy Enforcement Point) is the "smart firewall" enforcing them at each resource (≈ VPN + firewall + API + policy list).</p>`},
    {h:"Architecture Components", html:`
      <table class="ref"><tr><th>Component</th><th>Purpose</th></tr>
      <tr><td>IAM</td><td>Identity & Access Mgmt — identity, authentication (MFA), RBAC</td></tr>
      <tr><td>Jump box</td><td>Hardened access point to reach high-value systems</td></tr>
      <tr><td>PAM</td><td>Privileged Access Mgmt — password vaulting & session recording</td></tr>
      <tr><td>NAC</td><td>Network Access Control — device certs → VLAN admission</td></tr>
      <tr><td>IDS/IPS</td><td>Detect/prevent anomalous behaviour (often inside NGFW)</td></tr>
      <tr><td>VPN</td><td>Remote access into the internal network</td></tr>
      <tr><td>NGFW</td><td>Firewall + IDS/IPS + app-awareness + VPN</td></tr>
      <tr><td>SIEM</td><td>Aggregates & correlates security logs</td></tr>
      <tr><td>WAF</td><td>Protects web apps/APIs (SQLi, XSS)</td></tr></table>`},

    {q:"'Fail safely and securely' is best shown by:", opts:["Default-deny, then add exceptions","Block known-bad only","Allow all until an incident","Disable logging"], a:0, ex:"Default-deny (allowlist)."},
    {q:"In Zero Trust, a PDP is a…", opts:["Policy Decision Point (holds rules)","Policy Deployment Package","Port Discovery Protocol","Privileged Domain Provider"], a:0, ex:"PDP decides; PEP enforces."},
    {q:"Why does legacy implicit-trust architecture struggle today?", opts:["Too many firewalls","One exploited user becomes a trusted insider","No IPv6","Too much encryption"], a:1, ex:"Implicit internal trust means a single exploit grants broad access."},
    {q:"Risk of an incident is:", opts:["Likelihood × Impact","Likelihood + Impact","Impact ÷ Likelihood","CVSS alone"], a:0, ex:"Risk = Likelihood × Impact."},
    {q:"Which component is 'a hardened access point to reach high-value systems'?", opts:["NAC","Jump box","SIEM","Load balancer"], a:1, ex:"A jump box is the hardened intermediary."},
  ],
  labChecklist:[
    "Run a Greenbone scan end-to-end (credential → target → task → report)",
    "Compute a CVSS 4.0 base score from a scenario",
    "Run nmap -A vs nmap --script discovery and explain the difference",
    "Name the 7 POLICY principles with a control example each",
    "Sketch legacy vs Zero Trust architecture, labelling PDP/PEP",
  ],
},
];

/* ================================ APP ================================ */
const LS_KEY = "coit11241_progress_v2";
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function labKey(weekId, k){ return `w${weekId}_lab_${k}`; }
function weekLabStat(week){
  let total=0, done=0;
  week.labs.forEach((g,gi)=>g.items.forEach((_,ii)=>{ total++; if(progress[labKey(week.id,gi+"_"+ii)]) done++; }));
  return {done,total};
}
function overallLabStat(){
  let d=0,t=0; WEEKS.forEach(w=>{const s=weekLabStat(w); d+=s.done; t+=s.total;}); return {done:d,total:t};
}

function renderSidebar(route){
  const sb = document.getElementById("sidebar");
  let h = `<div class="brand"><div class="logo">🛡️</div><div><h1>COIT11241</h1><div class="tag">Cybersecurity Study Hub</div></div></div>`;
  h += `<div class="side-meta">Weeks 1–6 · HT2 2026</div>`;
  h += `<button class="nav-btn ${route==='overview'?'active':''}" onclick="go('overview')"><span class="ic">🏠</span><span class="lbl">Overview</span></button>`;
  h += `<div class="nav-label">Weekly content</div>`;
  WEEKS.forEach(w=>{
    const s = weekLabStat(w);
    h += `<button class="nav-btn ${route==='week-'+w.id?'active':''}" onclick="go('week-${w.id}')">
      <span class="ic">${w.id}</span><span class="lbl">${w.title}</span>
      <span class="pill ${s.done===s.total&&s.total>0?'done':''}">${s.done}/${s.total}</span></button>`;
    if(w.id%2===0){
      const t = TESTS.find(t=>t.weeks[1]===w.id);
      if(t){
        const best = progress["test_"+t.id+"_best"];
        h += `<button class="nav-btn sub ${route==='test-'+t.id?'active':''}" onclick="go('test-${t.id}')">
          <span class="ic">✓</span><span class="lbl">${t.title}</span>
          <span class="pill ${best===t.questions.length?'done':''}">${best!==undefined?best+'/'+t.questions.length:'test'}</span></button>`;
      }
    }
  });
  h += `<div class="nav-label">Reference</div>`;
  h += `<button class="nav-btn ${route==='vms'?'active':''}" onclick="go('vms')"><span class="ic">🖥️</span><span class="lbl">VM Cheat Sheet</span></button>`;
  sb.innerHTML = h;
}

function hero(eyebrow,title,sub){
  return `<div class="hero"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${sub||""}</p></div>`;
}

function ringSvg(pct){
  const r=52, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="ring"><svg width="120" height="120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#eaf0e2" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#2f9e6b" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><div class="val"><b>${pct}%</b><span>labs done</span></div></div>`;
}

function renderOverview(){
  const s = overallLabStat();
  const pct = s.total? Math.round(100*s.done/s.total):0;
  let h = hero("COIT11241 · Cybersecurity Technologies","Your Study Hub","Theory, slide-practice quizzes and lab checklists for every week — with a comprehensive checkpoint test after each pair of weeks. Built from your unit's own handouts and lecture slides.");
  h += `<div class="card"><h3><span class="dot"></span>Progress</h3>
    <div class="ring-wrap">${ringSvg(pct)}
      <div style="flex:1; min-width:220px;">
        <p class="muted" style="margin-top:0;">${s.done} of ${s.total} lab/practical items ticked across Weeks 1–6. Quiz scores save automatically too.</p>
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
      </div>
    </div></div>`;
  h += `<div class="card"><h3><span class="dot"></span>Assessment map</h3>
    <table class="ref"><tr><th>Assessment</th><th>Weight</th><th>Due</th></tr>
    <tr><td>A1 Attack Portfolio</td><td>50%</td><td>W4 Recon · W6 Vulns · W8 Internal · W10 Network</td></tr>
    <tr><td>A2 Demonstration</td><td>20%</td><td>Week 11 (live = 10% bonus, capped at 100%)</td></tr>
    <tr><td>A3 In-class Test</td><td>30%</td><td>Week 12 — need ≥10/30 to pass the unit</td></tr></table>
    <p class="muted">Break week falls between Week 6 and Week 7.</p></div>`;
  h += `<div class="card"><h3><span class="dot"></span>Weeks at a glance</h3><div class="week-chips">`;
  WEEKS.forEach(w=>{ h += `<div class="wchip"><b>Week ${w.id}</b><span>${w.title}</span></div>`; });
  h += `</div></div>`;
  h += `<div class="card"><h3><span class="dot"></span>How each week is laid out</h3>
    <p class="muted" style="margin-top:2px;">Every week flows the same way so nothing feels jumbled: <b>Readings → Theory → Key Terms → Slide Practice quiz → Lab checklist</b>. The Slide Practice questions are pulled straight from that week's lecture slides and handout, so answering them is a fast way to revise the slides. Checkpoint pages (after Weeks 2, 4, 6) add a recap, a bigger scored test, and a practical self-check.</p>
    <p class="muted">To extend for Week 7+: add an object to the <code>WEEKS</code> array near the top of this file — it appears in the nav automatically.</p></div>`;
  return h;
}

function renderWeek(w){
  let h = hero(`Week ${w.id}`, w.title, w.blurb);
  // Readings
  if(w.readings && w.readings.length){
    h += `<div class="card section"><h3><span class="dot"></span>Readings</h3><ul>${w.readings.map(r=>`<li>${r}</li>`).join("")}</ul></div>`;
  }
  // Theory
  h += `<div class="sec-head"><div class="chip">📘</div><div><h3>Theory</h3><p>Core concepts for the week</p></div></div>`;
  w.theory.forEach(sec=>{ h += `<div class="card section"><h3><span class="dot"></span>${sec.h}</h3>${sec.html}</div>`; });
  // Key terms
  h += `<div class="sec-head"><div class="chip">🔑</div><div><h3>Key Terms</h3><p>Quick-reference glossary</p></div></div>`;
  h += `<div class="card"><div class="terms-grid">${w.keyTerms.map(t=>`<div class="term"><b>${t.t}</b><span>${t.d}</span></div>`).join("")}</div></div>`;
  // VM note
  if(w.vmNote){ h += `<div class="card section"><h3><span class="dot"></span>Lab environment</h3>${vmGridHtml()}</div>`; }
  // Slide practice quiz
  if(w.slideQuiz && w.slideQuiz.length){
    h += `<div class="sec-head"><div class="chip">📝</div><div><h3>Slide Practice</h3><p>${w.slideQuiz.length} questions straight from this week's slides & handout</p></div></div>`;
    h += `<div class="card">${quizHtml('slide'+w.id, w.slideQuiz)}</div>`;
  }
  // Labs
  h += `<div class="sec-head"><div class="chip">🧪</div><div><h3>Lab / Practical</h3><p>Tutorial checklist — tick as you go</p></div></div>`;
  h += `<div class="card">`;
  w.labs.forEach((g,gi)=>{
    h += `<div class="lab-group"><div class="g-title">${g.h}</div>`;
    g.items.forEach((item,ii)=>{
      const key = labKey(w.id, gi+"_"+ii);
      h += `<div class="lab-step ${progress[key]?'done':''}"><input type="checkbox" id="${key}" ${progress[key]?'checked':''} onchange="toggleLab('${key}')"><label for="${key}">${item}</label></div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  return h;
}

function quizHtml(quizId, questions){
  let h = `<div class="quiz" id="quiz-${quizId}">`;
  questions.forEach((q,qi)=>{
    h += `<div class="quiz-q" data-qi="${qi}">
      <div class="qtext"><span class="qnum">${qi+1}</span><span>${q.q}</span></div>`;
    q.opts.forEach((opt,oi)=>{
      h += `<label class="qopt" data-oi="${oi}"><input type="radio" name="${quizId}_${qi}" value="${oi}"><span>${opt}</span></label>`;
    });
    h += `<div class="explain" id="exp-${quizId}-${qi}"><b>Why:</b> ${q.ex}</div></div>`;
  });
  h += `</div>
    <div class="btn-row">
      <button class="btn" onclick="grade('${quizId}')">Check answers</button>
      <button class="btn secondary" onclick="resetQuiz('${quizId}')">Reset</button>
      <span class="score-badge" id="score-${quizId}"></span>
    </div>`;
  return h;
}

// store question sets by quizId for grading
function questionsForQuiz(quizId){
  if(quizId.startsWith('slide')){ const w = WEEKS.find(w=>'slide'+w.id===quizId); return w?w.slideQuiz:[]; }
  if(quizId.startsWith('test')){ const id=parseInt(quizId.slice(4),10); const t=TESTS.find(t=>t.id===id); return t?t.questions:[]; }
  return [];
}

function grade(quizId){
  const qs = questionsForQuiz(quizId);
  const root = document.getElementById("quiz-"+quizId);
  let score=0;
  qs.forEach((q,qi)=>{
    const sel = root.querySelector(`input[name="${quizId}_${qi}"]:checked`);
    root.querySelectorAll(`.quiz-q[data-qi="${qi}"] .qopt`).forEach(l=>l.classList.remove("correct","incorrect"));
    const correctLbl = root.querySelector(`.quiz-q[data-qi="${qi}"] .qopt[data-oi="${q.a}"]`);
    if(correctLbl) correctLbl.classList.add("correct");
    if(sel){
      const ci = parseInt(sel.value,10);
      if(ci===q.a) score++;
      else { const wl = root.querySelector(`.quiz-q[data-qi="${qi}"] .qopt[data-oi="${ci}"]`); if(wl) wl.classList.add("incorrect"); }
    }
    document.getElementById(`exp-${quizId}-${qi}`).classList.add("show");
  });
  const badge = document.getElementById("score-"+quizId);
  badge.textContent = `Score: ${score} / ${qs.length}`;
  badge.classList.add("show");
  // persist bests
  let key = null;
  if(quizId.startsWith('slide')) key = "slidebest_"+quizId.slice(5);
  if(quizId.startsWith('test')) key = "test_"+quizId.slice(4)+"_best";
  if(key){
    if(progress[key]===undefined || score>progress[key]){ progress[key]=score; saveProgress(progress); renderSidebar(currentRoute()); }
  }
}
function resetQuiz(quizId){
  const root = document.getElementById("quiz-"+quizId);
  root.querySelectorAll("input[type=radio]").forEach(r=>r.checked=false);
  root.querySelectorAll(".qopt").forEach(l=>l.classList.remove("correct","incorrect"));
  root.querySelectorAll(".explain").forEach(e=>e.classList.remove("show"));
  const badge=document.getElementById("score-"+quizId); badge.textContent=""; badge.classList.remove("show");
}

function toggleLab(key){ progress[key]=!progress[key]; saveProgress(progress); render(); }

function renderTest(t){
  let h = hero(`Checkpoint · Weeks ${t.weeks.join(" & ")}`, t.title, "Recap the essentials, take the comprehensive test, then self-check your practical skills.");
  h += `<div class="card section"><h3><span class="dot"></span>Recap</h3><ul>${t.recap.map(r=>`<li>${r}</li>`).join("")}</ul></div>`;
  h += `<div class="sec-head"><div class="chip">✅</div><div><h3>Comprehensive Test</h3><p>${t.questions.length} questions across both weeks</p></div></div>`;
  h += `<div class="card">${quizHtml('test'+t.id, t.questions)}</div>`;
  h += `<div class="sec-head"><div class="chip">🧪</div><div><h3>Practical self-check</h3><p>Can you actually do these?</p></div></div>`;
  h += `<div class="card">`;
  t.labChecklist.forEach((item,ii)=>{
    const key = `test${t.id}_lab_${ii}`;
    h += `<div class="lab-step ${progress[key]?'done':''}"><input type="checkbox" id="${key}" ${progress[key]?'checked':''} onchange="toggleLab('${key}')"><label for="${key}">${item}</label></div>`;
  });
  h += `</div>`;
  return h;
}

function renderVms(){
  let h = hero("Reference","VM Cheat Sheet","The shared lab environment used from Week 3/4 onward — every VM lives on the 192.168.56.0/24 internal network.");
  h += `<div class="card section"><h3><span class="dot"></span>Machines</h3>${vmGridHtml()}</div>`;
  h += `<div class="card section"><h3><span class="dot"></span>Connectivity checks</h3>
    <pre>Win8 PS>  tnc 192.168.56.34        <span class="cmt"># ping Kali</span>
Win8 PS>  ping 192.168.56.2         <span class="cmt"># ping Greenbone (tnc is slow here)</span>
Kali $    ping 192.168.56.50        <span class="cmt"># ping Win8</span>
Greenbone $  ping 192.168.56.50     <span class="cmt"># Advanced > Support > Shell</span></pre></div>`;
  h += `<div class="card section"><h3><span class="dot"></span>Networking convention</h3>
    <ul><li>Adapter 1 = NAT (internet)</li><li>Adapter 2 = Internal Network, name <code>192.168.56.0/24</code> (same on every VM)</li>
    <li>Port-forward host TCP 2443 → Greenbone 443; host TCP 35080 → Ms2 80</li></ul></div>`;
  return h;
}

function currentRoute(){ return (location.hash||"#overview").replace("#",""); }
function render(){
  const route = currentRoute();
  const content = document.getElementById("content");
  const crumb = document.getElementById("crumb");
  let h="";
  if(route==="overview"){ h=renderOverview(); crumb.innerHTML="<b>Overview</b>"; }
  else if(route==="vms"){ h=renderVms(); crumb.innerHTML="<b>VM Cheat Sheet</b>"; }
  else if(route.startsWith("week-")){ const w=WEEKS.find(w=>w.id===+route.split("-")[1]); if(w){ h=renderWeek(w); crumb.innerHTML=`Weeks › <b>Week ${w.id}</b>`; } else { h=renderOverview(); } }
  else if(route.startsWith("test-")){ const t=TESTS.find(t=>t.id===+route.split("-")[1]); if(t){ h=renderTest(t); crumb.innerHTML=`Checkpoints › <b>${t.title}</b>`; } else { h=renderOverview(); } }
  else { h=renderOverview(); crumb.innerHTML="<b>Overview</b>"; }
  h += `<footer class="note">COIT11241 Study Hub · built from your Week 1–6 unit materials · progress saved locally in this browser</footer>`;
  content.innerHTML = h;
  renderSidebar(route);
  window.scrollTo(0,0);
}
function go(route){ location.hash = route; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);
render();
</script>
